version: '3.8'

services:
  app:
    build: .
    container_name: kas_seramc_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password_sementara}
      - DB_NAME=kas-seramc
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: kas_seramc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_sementara}
      MYSQL_DATABASE: kas-seramc
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kas_seramc_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  mysql_data:
