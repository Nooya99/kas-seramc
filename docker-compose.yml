version: '3.8'

services:
  app:
    build: .
    container_name: kas_seramc_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # host.docker.internal allows the container to talk to the VPS host network
      - DB_HOST=host.docker.internal
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-kas-seramc}
    extra_hosts:
      - "host.docker.internal:host-gateway"


